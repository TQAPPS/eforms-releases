name: Build & Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات التحديث (Release Notes):'
        required: false
        default: '• تحديثات عامة وتحسينات في الأداء.'
      force_update:
        description: 'هل التحديث إجباري؟ (Force Update)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ''
      BUILD_NUMBER: ''
      TAG_NAME: ''
      NOTES: ''
      FORCE_UPDATE: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0' # or channel: 'stable'
          channel: 'stable'
          cache: true

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d '\r')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//' | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "import os, base64, re; data = re.sub(r'-----.*?-----|\s+', '', os.environ.get('KEYSTORE_BASE64', '')); open('android/app/my-release-key.jks', 'wb').write(base64.b64decode(data))"
          fi
          
