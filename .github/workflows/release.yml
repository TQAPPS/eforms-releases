name: Build & Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات التحديث (Release Notes):'
        required: false
        default: '• تحديثات عامة وتحسينات في الأداء.'
      force_update:
        description: 'هل التحديث إجباري؟ (Force Update)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ''
      BUILD_NUMBER: ''
      TAG_NAME: ''
      NOTES: ''
      FORCE_UPDATE: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0' # or channel: 'stable'
          channel: 'stable'
          cache: true

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d '\r')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//' | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "import os, base64, re; data = re.sub(r'-----.*?-----|\s+', '', os.environ.get('KEYSTORE_BASE64', '')); open('android/app/my-release-key.jks', 'wb').write(base64.b64decode(data))"
          fi
          
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            echo "storePassword=${STORE_PASSWORD:-Nova0566#}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD:-Nova0566#}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-my-key-alias}" >> android/key.properties
            echo "storeFile=my-release-key.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Set Release Tag & Notes
        id: release_meta
        run: |
          TAG_NAME="v$VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
            FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          else
            NOTES="• إصدار جديد v$VERSION"
            FORCE_UPDATE="false"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "NOTES=$NOTES" >> $GITHUB_ENV
          echo "FORCE_UPDATE=$FORCE_UPDATE" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "إصدار ${{ env.TAG_NAME }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json Automatically
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          TAG_NAME: ${{ env.TAG_NAME }}
          NOTES: ${{ env.NOTES }}
          FORCE_UPDATE: ${{ env.FORCE_UPDATE }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          repo = os.environ['REPO']
          tag = os.environ['TAG_NAME']
          data = {
              "latest_version": os.environ['VERSION'],
              "build_number": int(os.environ['BUILD_NUMBER']),
              "apk_url": f"https://github.com/{repo}/releases/download/{tag}/app-release.apk",
              "release_notes": os.environ['NOTES'],
              "force_update": os.environ['FORCE_UPDATE'].lower() == "true",
              "publish_date": datetime.date.today().isoformat()
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit & Push updated version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json to v${VERSION}+${BUILD_NUMBER} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
