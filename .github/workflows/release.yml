name: Build & Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات التحديث (Release Notes):'
        required: false
        default: '• تحديثات عامة وتحسينات في الأداء.'
      force_update:
        description: 'هل التحديث إجباري؟ (Force Update)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ''
      BUILD_NUMBER: ''
      TAG_NAME: ''
      NOTES: ''
      FORCE_UPDATE: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d '\r')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//' | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 scripts/setup_keystore.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          chmod +x android/gradlew || true
          flutter build apk --release

      - name: Set Release Tag & Notes
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: python3 scripts/prepare_release_notes.py

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "إصدار ${{ env.TAG_NAME }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json Automatically
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          TAG_NAME: ${{ env.TAG_NAME }}
          NOTES: ${{ env.NOTES }}
          FORCE_UPDATE: ${{ env.FORCE_UPDATE }}
          REPO: ${{ github.repository }}
        run: python3 scripts/update_version_json.py

      - name: Commit & Push updated version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json to v${VERSION}+${BUILD_NUMBER} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
