          fi
          
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            echo "storePassword=${STORE_PASSWORD:-Nova0566#}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD:-Nova0566#}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-my-key-alias}" >> android/key.properties
            echo "storeFile=my-release-key.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Set Release Tag & Notes
        id: release_meta
        run: |
          python3 - <<'PYEOF'
          import json, os
          version = os.environ.get('VERSION', '')
          notes = f"• إصدار جديد v{version}"
          force_update = "false"
          
          event_name = "${{ github.event_name }}"
          if event_name == "workflow_dispatch":
              notes = """${{ github.event.inputs.release_notes }}""" or notes
              force_update = "${{ github.event.inputs.force_update }}"
          elif os.path.exists("version.json"):
              try:
                  with open("version.json", "r", encoding="utf-8") as f:
                      vdata = json.load(f)
                      if vdata.get("latest_version") == version and vdata.get("release_notes"):
                          notes = vdata["release_notes"]
                      if "force_update" in vdata:
                          force_update = str(vdata["force_update"]).lower()
              except Exception as e:
                  print("Warning reading version.json:", e)
          
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"TAG_NAME=v{version}\n")
              f.write(f"FORCE_UPDATE={force_update}\n")
              f.write("NOTES<<EOF\n")
              f.write(notes + "\n")
              f.write("EOF\n")
          PYEOF

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "إصدار ${{ env.TAG_NAME }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json Automatically
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          TAG_NAME: ${{ env.TAG_NAME }}
          NOTES: ${{ env.NOTES }}
          FORCE_UPDATE: ${{ env.FORCE_UPDATE }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          repo = os.environ['REPO']
          tag = os.environ['TAG_NAME']
          data = {
              "latest_version": os.environ['VERSION'],
              "build_number": int(os.environ['BUILD_NUMBER']),
              "apk_url": f"https://github.com/{repo}/releases/download/{tag}/app-release.apk",
              "release_notes": os.environ['NOTES'],
              "force_update": os.environ['FORCE_UPDATE'].lower() == "true",
              "publish_date": datetime.date.today().isoformat()
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit & Push updated version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json to v${VERSION}+${BUILD_NUMBER} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
